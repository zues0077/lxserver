name: Build and Release

# 关键变更（2026-10-23）：桌面产物不再走 actions/upload-artifact + download-artifact，
# 改为各构建任务直接把文件 `gh release upload` 到同一个 Release。
# 原因：免费账号 artifact 存储配额只有 500MB，而一次全平台桌面构建产物约 1.4GB，
# 一旦超出就会在第一个 upload-artifact 步骤直接报
# 「Artifact storage quota has been hit」，后续 job 全部跳过，Release 一个资产都出不来。
# Release 资产不占 artifact 配额，因此直传是根治办法。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. 初始化阶段：获取版本号、生成发布说明、建/复用 Release ────────────────
  init:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from config
        id: get_version
        run: |
          VERSION=$(grep "version:" public/js/config.js | sed "s/.*'\(.*\)'.*/\1/")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Prepare release with notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          awk '/^## v/ {if (p) exit; p=1} p' changelog.md > RELEASE_NOTES.md || cp changelog.md RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "---" >> RELEASE_NOTES.md
          echo "* 本次版本由 @zues0077 维护构建 🚀" >> RELEASE_NOTES.md

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION 已存在，复用并刷新发布说明"
            gh release edit "$VERSION" --notes-file RELEASE_NOTES.md
          else
            echo "创建 draft Release $VERSION（构建全部成功后再正式发布）"
            gh release create "$VERSION" \
              --draft \
              --title "LX Music Sync Server $VERSION" \
              --notes-file RELEASE_NOTES.md
          fi

  # ── 2. 桌面端构建阶段：构建后直接上传到 Release ─────────────────────────────
  build_desktop:
    needs: init
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    name: Build Desktop (${{ matrix.platform }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev libnss3 libxss1 libasound2t64

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npx @electron/rebuild --version $(node -e "console.log(require('electron/package.json').version)")
        env:
          npm_config_build_from_source: true

      - name: Build JS source
        run: npm run electron:build

      - name: Package Electron app
        run: npx electron-builder --${{ matrix.platform }} --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # 一次性把本平台的安装包传进 Release：文件名带空格，必须用 find -print0 取，
      # 直接 glob 会被空格拆词。--clobber 支持同版本重跑覆盖。
      - name: Upload installers to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.init.outputs.VERSION }}
        run: |
          shopt -s nullglob
          files=()
          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(find dist-electron -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -print0)

          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::dist-electron 下没有任何安装包产物"
            exit 1
          fi

          echo "待上传 ${#files[@]} 个文件："
          printf '  %s\n' "${files[@]}"
          gh release upload "$VERSION" "${files[@]}" --clobber

  # ── 3. 服务端构建阶段：打包 Server Zip 并直传 Release ───────────────────────
  build_server:
    needs: init
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and Build
        run: |
          npm ci
          node scripts/download-binary.js --all
          npm run build
          # 清理开发依赖，仅保留生产运行环境
          rm -rf node_modules
          npm ci --omit=dev

      - name: Build and Zip Server
        run: |
          mkdir -p release/lx-music-sync-server
          cp -r server node_modules public scripts index.js package.json release/lx-music-sync-server/
          [ -f "config.js" ] && cp config.js release/lx-music-sync-server/
          cd release
          zip -r lx-music-sync-server-${{ needs.init.outputs.VERSION }}-server.zip lx-music-sync-server

      - name: Upload Server Zip to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.init.outputs.VERSION }}
        run: gh release upload "$VERSION" release/*.zip --clobber

  # ── 4. 发布阶段：校验资产齐全后把 draft 转正 ────────────────────────────────
  publish:
    needs: [init, build_desktop, build_server]
    runs-on: ubuntu-latest
    steps:
      - name: Verify assets then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.init.outputs.VERSION }}
        run: |
          EXPECTED=14
          count=$(gh release view "$VERSION" --json assets --jq '.assets | length')
          echo "Release $VERSION 当前资产数：$count（期望 >= $EXPECTED）"
          gh release view "$VERSION" --json assets --jq '.assets[] | "  \(.name)  \(.size)"'

          if [ "$count" -lt "$EXPECTED" ]; then
            echo "::error::资产数 $count < $EXPECTED，构建产物不完整，保持 draft 不发布"
            exit 1
          fi

          gh release edit "$VERSION" --draft=false --latest
          echo "已发布 $VERSION"
